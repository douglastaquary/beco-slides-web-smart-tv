<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Beco da Praia — Painel de Ofertas</title>
  <link rel="preload" href="assets/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/baloo2-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="assets/img/logo-beco-black.png">
  <!-- Ao editar CSS/JS, aumente o ?v= para a TV não usar arquivos antigos do cache. -->
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <div id="palco" class="palco">
    <div class="parede"></div>
    <div class="faixa-luz faixa-luz--topo"></div>
    <div class="neon neon--1"></div>
    <div class="neon neon--2"></div>
    <div class="neon neon--3"></div>
    <div class="neon neon--4"></div>

    <div class="totem">
      <div class="tela" id="tela-esquerda">
        <div class="tela-conteudo"></div>
        <div class="tela-reflexo"></div>
      </div>
      <div class="tela" id="tela-direita">
        <div class="tela-conteudo"></div>
        <div class="tela-reflexo"></div>
      </div>
    </div>

    <div class="chao"></div>
  </div>

  <script src="js/slides.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
